name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # Crucial permission required to create a release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Match your targeted .NET version

      - name: Publish App
        run: |
          dotnet publish WebCamCap/WebCamCap.scproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true -o ./publish

      - name: Zip Artifact
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./WebCamCap.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./WebCamCap.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
